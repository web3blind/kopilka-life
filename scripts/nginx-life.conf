server
{
    listen 80;
    listen 443 ssl http2;
    server_name life.blinddev.xyz;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/life.blinddev.xyz.conf;
    #CERT-APPLY-CHECK--END
    #SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/life.blinddev.xyz/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/life.blinddev.xyz/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    # HTTP -> HTTPS
    if ($scheme = http) { return 301 https://$host$request_uri; }

    # ACME/well-known must be served by nginx (for cert renewal)
    location ~ ^/\.well-known/ {
        allow all;
        root /www/wwwroot/life.blinddev.xyz;
    }

    # Block sensitive files before proxying
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md)$ {
        return 404;
    }

    # Everything else -> Node backend
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    access_log  /www/wwwlogs/life.blinddev.xyz.log;
    error_log  /www/wwwlogs/life.blinddev.xyz.error.log;
}
